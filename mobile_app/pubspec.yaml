name: mahel_pos_mobile
description: "النماء ERP & POS Mobile App - Offline POS & Cloud Sync"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.5

  # Database (Offline-First) - Drift هو البديل الحديث والآمن لـ sqflite
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Network & Sync
  dio: ^5.5.0+1
  connectivity_plus: ^6.0.3

  # Auth & Secure Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Background Sync
  workmanager: ^0.5.2
  flutter_local_notifications: ^17.2.1+1

  # UI & Theming
  google_fonts: ^6.2.1
  go_router: ^14.2.0
  intl: ^0.19.0
  fl_chart: ^0.69.0

  # Barcode & Camera
  mobile_scanner: ^5.1.1

  # Images & Files
  image_picker: ^1.1.2
  permission_handler: ^11.3.1

  # PDF & Printing
  pdf: ^3.11.0
  printing: ^5.12.0

  # Utils
  uuid: ^4.4.0
  decimal: ^3.0.1
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
