workflows:
  android-apk:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter dependencies
        script: |
          cd mobile_app
          flutter pub get
      - name: Build Android APK
        script: |
          cd mobile_app
          flutter build apk --release
    artifacts:
      - mobile_app/build/app/outputs/flutter-apk/app-release.apk
