workflows:
  android-apk-build:
    name: Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    working_directory: mobile_app
    environment:
      flutter: stable
    scripts:
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - mobile_app/build/app/outputs/flutter-apk/app-release.apk
